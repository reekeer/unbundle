name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Pack
        run: npm pack

      - name: Run the packed CLI with Node through npx
        run: |
          mkdir -p "$RUNNER_TEMP/npx-check"
          cd "$RUNNER_TEMP/npx-check"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz
          npx unbundle --help

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: package
          path: "*.tgz"

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: unbundle
      url: https://www.npmjs.com/package/@reekeer/unbundle

    permissions:
      id-token: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Download package
        uses: actions/download-artifact@v5
        with:
          name: package
          path: artifact/

      - name: Check if version is already published
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@reekeer/unbundle@$version" version >/dev/null 2>&1; then
            echo "@reekeer/unbundle@$version is already on npm, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish ./artifact/*.tgz --access public --tag ${{ needs.build.outputs.prerelease == 'true' && 'next' || 'latest' }}

  github-release:
    needs: [build, npm]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v5
        with:
          name: package
          path: artifact/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*.tgz
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
